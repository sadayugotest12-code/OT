<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>เปลี่ยนรหัสผ่าน - ระบบจัดการ OT</title>
	<link rel="stylesheet" href="ot.css" />
	<style>
		.login-wrap { max-width: 380px; margin: 10vh auto; padding: 0 16px; }
		.login-card { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 28px 24px; }
		.login-card h1 { font-size: 20px; margin: 0 0 4px; }
		.login-card p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
		.login-card label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
		.login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--grid); border-radius: 8px; font-size: 15px; margin-bottom: 16px; }
		.login-card button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; cursor: pointer; }
		.login-card button:disabled { opacity: .6; cursor: not-allowed; }
		.login-error { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
	</style>
</head>
<body>
	<div class="login-wrap">
		<div class="login-card">
			<h1>เปลี่ยนรหัสผ่าน</h1>
			<p>กรุณาตั้งรหัสผ่านใหม่ก่อนเข้าใช้งานระบบ (เข้าสู่ระบบครั้งแรกเท่านั้น)</p>
			<form id="changeForm">
				<label for="oldPassword">รหัสผ่านเดิม</label>
				<input id="oldPassword" type="password" autocomplete="current-password" required />
				<label for="newPassword">รหัสผ่านใหม่</label>
				<input id="newPassword" type="password" autocomplete="new-password" required minlength="4" />
				<div class="login-error" id="changeError"></div>
				<button type="submit" id="changeBtn">บันทึกรหัสผ่านใหม่</button>
			</form>
		</div>
	</div>

	<script src="auth.js"></script>
	<script>
		OTAuth.requireLogin();

		const form = document.getElementById("changeForm");
		const errorBox = document.getElementById("changeError");
		const btn = document.getElementById("changeBtn");

		form.addEventListener("submit", async (e) => {
			e.preventDefault();
			errorBox.textContent = "";
			btn.disabled = true;
			try {
				const oldPassword = document.getElementById("oldPassword").value;
				const newPassword = document.getElementById("newPassword").value;
				await OTAuth.changePassword(oldPassword, newPassword);
				window.location.href = "ot.html";
			} catch (err) {
				errorBox.textContent = err.message || "เปลี่ยนรหัสผ่านไม่สำเร็จ";
			} finally {
				btn.disabled = false;
			}
		});
	</script>
</body>
</html>
